name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Deploy VLESS Worker
        run: npx wrangler deploy --config wrangler.toml --env vless
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          UUID: ${{ secrets.UUID }}
      - name: Deploy DoH Worker
        run: npx wrangler deploy --config wrangler.toml --env doh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
