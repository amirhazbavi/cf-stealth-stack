mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://cf-doh.YOUR-SUBDOMAIN.workers.dev/dns-query
    - https://cloudflare-dns.com/dns-query

proxies:
  - name: "CF-JP"
    type: vless
    server: YOUR-VLESS-DOMAIN.pages.dev
    port: 443
    uuid: YOUR-UUID-HERE
    network: ws
    tls: true
    servername: YOUR-VLESS-DOMAIN.pages.dev
    ws-opts:
      path: "/?ed=2048"
      headers:
        Host: YOUR-VLESS-DOMAIN.pages.dev
    udp: false

proxy-groups:
  - name: PROXY
    type: select
    proxies: [CF-JP, DIRECT]

rules:
  - MATCH,PROXY
